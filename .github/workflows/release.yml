name: Release Build Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0-alpha)'
        required: false
        default: 'v0.1.0-alpha'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests & Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Dart Analyzer
        run: dart analyze --fatal-infos

      - name: Run Unit Tests
        run: dart test

  build-macos:
    name: Build macOS Desktop Release
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install monorepo dependencies
        run: dart pub get

      - name: Build macOS Release Bundle
        run: |
          cd apps/desktop
          flutter build macos --release

      - name: Package macOS App into Archive
        run: |
          cd apps/desktop/build/macos/Build/Products/Release
          zip -r AndroMac-macOS.zip AndroMac.app
          mkdir -p ../../../../../../artifacts
          cp AndroMac-macOS.zip ../../../../../../artifacts/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: andromac-macos-release
          path: artifacts/AndroMac-macOS.zip
          if-no-files-found: error

  build-android:
    name: Build Android Releases (Direct & Play)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install monorepo dependencies
        run: dart pub get

      - name: Build Android Direct Flavor APK (Full Features & SMS)
        run: |
          cd apps/phone
          flutter build apk --flavor direct --release

      - name: Build Android Play Flavor APK (Google Play Compliant)
        run: |
          cd apps/phone
          flutter build apk --flavor play --release

      - name: Build Android Play Flavor App Bundle (AAB)
        run: |
          cd apps/phone
          flutter build appbundle --flavor play --release

      - name: Collect Android Artifacts
        run: |
          mkdir -p artifacts
          cp apps/phone/build/app/outputs/flutter-apk/app-direct-release.apk artifacts/AndroMac-Android-direct.apk
          cp apps/phone/build/app/outputs/flutter-apk/app-play-release.apk artifacts/AndroMac-Android-play.apk
          cp apps/phone/build/app/outputs/bundle/playRelease/app-play-release.aab artifacts/AndroMac-Android-play.aab

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: andromac-android-release
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish Release to GitHub
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Release
        uses: actions/download-artifact@v4
        with:
          name: andromac-macos-release
          path: release-assets/

      - name: Download Android Releases
        uses: actions/download-artifact@v4
        with:
          name: andromac-android-release
          path: release-assets/

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0-alpha-${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "AndroMac Release ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: true
          files: |
            release-assets/*
          body: |
            ## AndroMac (Bridge) Release ${{ steps.tag.outputs.tag_name }}

            Автоматическая релизная сборка для платформ macOS и Android.

            ### 📦 Прикрепленные файлы релиза:
            - **`AndroMac-macOS.zip`**: Настольное приложение для macOS (меню-бар, AppKit).
            - **`AndroMac-Android-direct.apk`**: Полная версия Android приложения (SMS-клиент, прямое распространение).
            - **`AndroMac-Android-play.apk`**: Google Play-совместимая сборка Android приложения (без SMS-разрешений).
            - **`AndroMac-Android-play.aab`**: Релизный Android App Bundle для загрузки в Google Play Console.

            ### 🔒 Безопасность и приватность:
            - **Local-First & Zero-Cloud**: Никаких облачных серверов, все данные передаются исключительно в локальной сети (LAN).
            - **mTLS 1.3**: Взаимная аутентификация по сертификатам X.509 и Certificate Pinning.
            - **Zero-Log PII**: Персональные данные, SMS, буфер обмена и OTP-коды не логируются.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
