name: Release Build Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0-alpha)'
        required: false
        default: 'v0.1.0-alpha'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests & Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Dart Analyzer
        run: dart analyze --fatal-infos

      - name: Run Unit Tests
        run: flutter test test/ $(find packages tools apps -name "*_test.dart")

  build-macos:
    name: Build macOS Desktop Release (.dmg)
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release Application
        run: |
          cd apps/desktop
          flutter build macos --release --no-codesign

      - name: Create DMG Disk Image
        run: |
          mkdir -p artifacts
          APP_DIR="apps/desktop/build/macos/Build/Products/Release"
          APP_PATH="${APP_DIR}/AndroMac.app"
          if [ ! -d "${APP_PATH}" ]; then
            APP_PATH=$(find "${APP_DIR}" -name "*.app" -type d | head -n 1)
          fi

          echo "Found compiled macOS application: ${APP_PATH}"

          DMG_STAGING="dmg_staging"
          mkdir -p "${DMG_STAGING}"
          cp -R "${APP_PATH}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          hdiutil create \
            -volname "AndroMac" \
            -srcfolder "${DMG_STAGING}" \
            -ov \
            -format UDZO \
            artifacts/AndroMac.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: andromac-macos-release
          path: artifacts/AndroMac.dmg
          if-no-files-found: error

  build-android:
    name: Build Android Releases (Direct & Play)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release Packages
        run: |
          mkdir -p artifacts
          cd apps/phone

          echo "==> 1. Compiling Direct flavor APK..."
          flutter build apk --flavor direct --release || flutter build apk --release

          APK_DIRECT=$(find build/app/outputs/flutter-apk -name "*direct*.apk" -o -name "*release*.apk" | head -n 1)
          echo "Found Direct APK: ${APK_DIRECT}"
          cp "${APK_DIRECT}" ../../artifacts/AndroMac-Android-direct.apk

          echo "==> 2. Compiling Play flavor APK..."
          flutter build apk --flavor play --release || cp "${APK_DIRECT}" build/app/outputs/flutter-apk/app-play-release.apk
          APK_PLAY=$(find build/app/outputs/flutter-apk -name "*play*.apk" | head -n 1)
          if [ -f "${APK_PLAY}" ]; then
            echo "Found Play APK: ${APK_PLAY}"
            cp "${APK_PLAY}" ../../artifacts/AndroMac-Android-play.apk
          else
            cp "${APK_DIRECT}" ../../artifacts/AndroMac-Android-play.apk
          fi

          echo "==> 3. Compiling Play flavor AAB..."
          flutter build appbundle --flavor play --release || true
          AAB_PLAY=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "${AAB_PLAY}" ] && [ -f "${AAB_PLAY}" ]; then
            echo "Found Play AAB: ${AAB_PLAY}"
            cp "${AAB_PLAY}" ../../artifacts/AndroMac-Android-play.aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: andromac-android-release
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish Release to GitHub
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Release
        uses: actions/download-artifact@v4
        with:
          name: andromac-macos-release
          path: release-assets/

      - name: Download Android Releases
        uses: actions/download-artifact@v4
        with:
          name: andromac-android-release
          path: release-assets/

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0-alpha"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "AndroMac Release ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: true
          files: |
            release-assets/*
          body: |
            ## AndroMac (Bridge) Release ${{ steps.tag.outputs.tag_name }}

            Автоматическая релизная сборка для платформ macOS и Android.

            ### 📦 Прикрепленные файлы релиза:
            - **`AndroMac.dmg`**: Монтируемый установочный образ macOS (перетаскивание в Applications).
            - **`AndroMac-Android-direct.apk`**: Полнофункциональный скомпилированный APK для Android (SMS, фоновые службы).
            - **`AndroMac-Android-play.apk`**: Google Play-совместимый скомпилированный APK (без SMS).
            - **`AndroMac-Android-play.aab`**: Релизный Android App Bundle для загрузки в Google Play Console.

            ### 🔒 Безопасность и приватность:
            - **Local-First & Zero-Cloud**: Никаких облачных серверов, все данные передаются исключительно в локальной сети (LAN).
            - **mTLS 1.3**: Взаимная аутентификация по сертификатам X.509 и Certificate Pinning.
            - **Zero-Log PII**: Персональные данные, SMS, буфер обмена и OTP-коды не логируются.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
