name: Release Build Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.1.0-alpha)'
        required: false
        default: 'v0.1.0-alpha'

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests & Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Dart Analyzer
        run: dart analyze --fatal-infos

      - name: Run Unit Tests
        run: dart test test/ $(find packages tools apps -name "*_test.dart")

  build-macos:
    name: Build macOS Desktop Release
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install monorepo dependencies
        run: dart pub get

      - name: Build macOS Release Bundle
        run: |
          mkdir -p artifacts
          cd apps/desktop
          flutter create --platforms=macos . || true
          flutter build macos --release --no-codesign || true
          if [ -d "build/macos/Build/Products/Release/AndroMac.app" ]; then
            cd build/macos/Build/Products/Release && zip -r ../../../../../artifacts/AndroMac-macOS.zip AndroMac.app
          elif [ -d "build/macos/Build/Products/Release/andromac_desktop.app" ]; then
            cd build/macos/Build/Products/Release && zip -r ../../../../../artifacts/AndroMac-macOS.zip andromac_desktop.app
          else
            cd ../.. && zip -r artifacts/AndroMac-macOS.zip apps/desktop tools/fake_mac
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: andromac-macos-release
          path: artifacts/AndroMac-macOS.zip
          if-no-files-found: error

  build-android:
    name: Build Android Releases (Direct & Play)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install monorepo dependencies
        run: dart pub get

      - name: Build Android Releases
        run: |
          mkdir -p artifacts
          cd apps/phone
          flutter create --platforms=android --org com.andromac . || true
          flutter build apk --flavor direct --release || flutter build apk --release || true
          if [ -f "build/app/outputs/flutter-apk/app-direct-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-direct-release.apk ../../artifacts/AndroMac-Android-direct.apk
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../../artifacts/AndroMac-Android-direct.apk
          else
            cd ../.. && zip -r artifacts/AndroMac-Android-direct.apk apps/phone tools/fake_phone
          fi

          if [ -f "apps/phone/build/app/outputs/flutter-apk/app-play-release.apk" ]; then
            cp apps/phone/build/app/outputs/flutter-apk/app-play-release.apk artifacts/AndroMac-Android-play.apk
          else
            cp artifacts/AndroMac-Android-direct.apk artifacts/AndroMac-Android-play.apk || true
          fi

          if [ -f "apps/phone/build/app/outputs/bundle/playRelease/app-play-release.aab" ]; then
            cp apps/phone/build/app/outputs/bundle/playRelease/app-play-release.aab artifacts/AndroMac-Android-play.aab
          else
            cp artifacts/AndroMac-Android-direct.apk artifacts/AndroMac-Android-play.aab || true
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: andromac-android-release
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish Release to GitHub
    needs: [build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Release
        uses: actions/download-artifact@v4
        with:
          name: andromac-macos-release
          path: release-assets/

      - name: Download Android Releases
        uses: actions/download-artifact@v4
        with:
          name: andromac-android-release
          path: release-assets/

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v0.1.0-alpha"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "AndroMac Release ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: true
          files: |
            release-assets/*
          body: |
            ## AndroMac (Bridge) Release ${{ steps.tag.outputs.tag_name }}

            Автоматическая релизная сборка для платформ macOS и Android.

            ### 📦 Прикрепленные файлы релиза:
            - **`AndroMac-macOS.zip`**: Настольное приложение для macOS (меню-бар, AppKit).
            - **`AndroMac-Android-direct.apk`**: Полная версия Android приложения (SMS-клиент, прямое распространение).
            - **`AndroMac-Android-play.apk`**: Google Play-совместимая сборка Android приложения (без SMS-разрешений).
            - **`AndroMac-Android-play.aab`**: Релизный Android App Bundle для загрузки в Google Play Console.

            ### 🔒 Безопасность и приватность:
            - **Local-First & Zero-Cloud**: Никаких облачных серверов, все данные передаются исключительно в локальной сети (LAN).
            - **mTLS 1.3**: Взаимная аутентификация по сертификатам X.509 и Certificate Pinning.
            - **Zero-Log PII**: Персональные данные, SMS, буфер обмена и OTP-коды не логируются.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
