name: andromac_workspace
description: Monorepo workspace for AndroMac (Bridge)
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/bridge_protocol
  - packages/bridge_crypto
  - packages/bridge_transport
  - packages/bridge_core
  - packages/features/clipboard
  - packages/features/notifications
  - packages/features/sms
  - packages/features/device_status
  - tools/fake_phone
